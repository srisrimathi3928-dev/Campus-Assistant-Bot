openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: student-support
    description: Student support chatbot operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /topics:
    get:
      operationId: getStudentTopics
      tags: [student-support]
      summary: List student support topics
      responses:
        "200":
          description: Available support topics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentTopic"
  /chat:
    post:
      operationId: askStudentAssistant
      tags: [student-support]
      summary: Ask the student assistant a question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatQuestion"
      responses:
        "200":
          description: Assistant answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatAnswer"
        "400":
          description: Invalid question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    StudentTopic:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        description:
          type: string
        prompt:
          type: string
      required:
        - id
        - label
        - description
        - prompt
    ChatQuestion:
      type: object
      properties:
        question:
          type: string
          minLength: 1
      required:
        - question
    ChatAnswer:
      type: object
      properties:
        answer:
          type: string
        topic:
          type: string
        suggestedQuestions:
          type: array
          items:
            type: string
      required:
        - answer
        - topic
        - suggestedQuestions
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

